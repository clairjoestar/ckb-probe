[package]
name = "ckb-probe"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Deep observability tool for CKB nodes based on eBPF"

[[bin]]
name = "ckb-probe"
path = "src/main.rs"

[dependencies]
ckb-probe-common = { path = "../ckb-probe-common" }

# ELF parsing
goblin = "0.9"

# Rust symbol demangling
rustc-demangle = "0.1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Terminal output
colored = "2"

# Error handling
anyhow = "1"

# System info (for check subcommand)
libc = "0.2"
nix = { version = "0.29", features = ["user"] }

# eBPF userspace (for check --pid validation)
aya = { version = "0.13", features = ["async_tokio"] }

# Async runtime (for eBPF perf event reading)
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
log = "0.4"
env_logger = "0.11"
bytes = "1.11.1"
